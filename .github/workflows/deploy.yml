name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "data/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble Pages Bundle
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BUILD_ID: ${{ github.sha }}
        run: |
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/data
          cp -r data/* _site/data/
          # The canonical link is a placeholder in the source file; Pages knows
          # the final URL only at deploy time.
          sed -i "s|__PAGES_URL__|${PAGES_URL}|g" _site/index.html
          # Cache-bust the static assets: browsers hold index.html for up to
          # 10 minutes but would otherwise keep serving a stale app.js with
          # the new markup, which breaks the boards.
          sed -i "s|__BUILD_ID__|${BUILD_ID}|g" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
